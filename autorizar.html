<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorizar orden de compra · Ypoti</title>
<style>body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#F5F3EC;color:#17241C;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}a{display:inline-block;margin-top:18px;background:#04522B;color:#fff;padding:14px 22px;border-radius:12px;text-decoration:none;font-weight:600}</style>
</head><body><div><h1 style="font-size:22px;color:#04522B">Orden de compra de ganado</h1><p id="t">Abriendo la página de autorización…</p><a id="l" href="#" style="display:none">Abrir la página de autorización</a></div>
<script>
(function(){ var SERVIDOR = 'https://script.google.com/macros/s/AKfycbzpJMDSnuFe7jQjVYM7pqa-Q1Jnydm21VRosUvgcLKhAv8DFrDMRrV5ih-A9sLAhXX0Tg/exec';
  var tok = (new URLSearchParams(location.search).get('oc') || '').replace(/[^A-Za-z0-9-]/g, '');
  if (!tok) { document.getElementById('t').textContent = 'El enlace no tiene el código de la orden. Ábrala desde el correo o desde el app.'; return; }
  var url = SERVIDOR + '?oc=' + encodeURIComponent(tok); var l = document.getElementById('l'); l.href = url; l.style.display = 'inline-block';
  location.replace(url); })();
</script></body></html>
